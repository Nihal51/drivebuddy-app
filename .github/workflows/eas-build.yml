# ============================================================================
#  Build the app on EAS from GitHub — no computer needed.
#
#  Actions tab → "Build app" → Run workflow → pick what to build. When EAS
#  finishes (10–20 minutes) the build appears on expo.dev with a download link
#  and QR code; `preview` gives an APK you can install on any Android phone.
#
#  ONE-TIME SETUP
#    1. Run your first build from your computer (docs/SETUP.md step 6): EAS
#       creates the Android signing key then, which needs a yes/no answer.
#    2. expo.dev → Account settings → Access tokens → Create token.
#    3. GitHub → this repo → Settings → Secrets and variables → Actions →
#       New repository secret: name EXPO_TOKEN, value the token.
# ============================================================================

name: Build app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: What to build
        type: choice
        options:
          - preview # installable APK for testing on any Android phone
          - development # test app that loads code from your computer
          - production # store build (.aab for Google Play, .ipa for the App Store)
        default: preview
      platform:
        description: For which phones
        type: choice
        options: [android, ios, all]
        default: android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (see the top of .github/workflows/eas-build.yml)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start the build on EAS
        working-directory: apps/customer
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait
